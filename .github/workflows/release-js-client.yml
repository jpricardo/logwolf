name: Publish logwolf-client-js to npm

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: ci
        working-directory: logwolf-client/js
        run: npm ci
      # npm publish takes the version from package.json, whatever the release
      # is called; a release tagged v2.0.1 on a package still at 2.0.0 would
      # publish 2.0.0. The two must agree.
      - name: check the tag matches package.json
        working-directory: logwolf-client/js
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release $TAG does not match package.json ($VERSION)"
            exit 1
          fi
      # A published version cannot be taken back: test before, not after.
      - name: typecheck
        working-directory: logwolf-client/js
        run: npx tsc --noEmit
      - name: test
        working-directory: logwolf-client/js
        run: npx vitest run
      - name: publish
        working-directory: logwolf-client/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
