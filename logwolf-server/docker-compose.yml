version: '3'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ./frontend.dockerfile
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      API_URL: http://broker:80/
      SESSION_SECRET: changeme-use-a-real-secret-in-production
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      LOGWOLF_ALLOWED_GITHUB_USERS: ${LOGWOLF_ALLOWED_GITHUB_USERS:-}
      LOGWOLF_ALLOWED_GITHUB_ORGS: ${LOGWOLF_ALLOWED_GITHUB_ORGS:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      API_KEY: ${API_KEY}
    networks:
      - public
      - internal

  broker:
    build:
      context: .
      dockerfile: ./broker/broker.dockerfile
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    networks:
      - public
      - internal

  logger:
    build:
      context: .
      dockerfile: ./logger/logger.dockerfile
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
    environment:
      # Owners of the Default project created by the startup migration when an
      # existing deployment is upgraded from a pre-multi-tenancy build.
      LOGWOLF_ALLOWED_GITHUB_USERS: ${LOGWOLF_ALLOWED_GITHUB_USERS:-}
      # Extra owners for that project; how org-only deployments get one.
      LOGWOLF_DEFAULT_PROJECT_OWNERS: ${LOGWOLF_DEFAULT_PROJECT_OWNERS:-}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
    networks:
      - internal

  listener:
    build:
      context: .
      dockerfile: ./listener/listener.dockerfile
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - internal

  mongo:
    image: 'mongo:4.2.16-bionic'
    deploy:
      mode: replicated
      replicas: 1
    environment:
      MONGO_INITDB_DATABASE: logs
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    # MongoDB runs as a single-member replica set because the data layer uses
    # transactions, which a standalone mongod refuses. A replica set with auth
    # needs a keyfile; the only member it authenticates to is itself, so a fresh
    # one on every start is fine.
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        exec docker-entrypoint.sh "$$@"
      - --
    command: ['mongod', '--replSet', 'rs0', '--keyFile', '/tmp/mongo-keyfile', '--bind_ip_all']
    # The healthcheck also initiates the replica set the first time it finds one
    # that isn't, which covers new volumes and existing standalone ones alike.
    # Healthy means this node is primary and takes writes.
    healthcheck:
      test:
        - CMD
        - mongo
        - --quiet
        - --username=admin
        - --password=password
        - --authenticationDatabase=admin
        - --eval
        - >-
          var s = rs.status();
          if (s.codeName === 'NotYetInitialized') {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            s = rs.status();
          }
          quit(s.ok === 1 && db.isMaster().ismaster ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - ./db-data/mongo/:/data/db
    networks:
      - internal

  rabbitmq:
    image: 'rabbitmq:3.9-alpine'
    deploy:
      mode: replicated
      replicas: 1
    volumes:
      - ./db-data/rabbitmq/:/var/lib/rabbitmq/
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - frontend
      - broker
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./db-data/caddy/data:/data
      - ./db-data/caddy/config:/config
    networks:
      - public

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
